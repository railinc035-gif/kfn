<meta charset="UTF-8">

<title>App de Historias</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* =========================
       PANTALLA DEL LOGO
    ========================== */

    #splash {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        overflow: hidden;

        animation: splashOut 0.7s ease forwards;
        animation-delay: 2.3s;
    }

    /* Luz detrás del logo */
    .glow {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;

        background: rgba(255,255,255,0.08);
        filter: blur(45px);

        animation: glowPulse 1.4s ease-in-out infinite;
    }

    /* Logo */
    #logo {
        position: relative;
        width: min(55vw, 280px);
        max-height: 280px;
        object-fit: contain;

        opacity: 0;
        transform: scale(0.75);
        filter:
            blur(10px)
            brightness(1.5)
            drop-shadow(0 0 15px rgba(255,255,255,0.5));

        animation: logoAppear 1.1s cubic-bezier(.17,.67,.25,1.2) forwards;
    }

    /* =========================
       ANIMACIONES
    ========================== */

    @keyframes logoAppear {
        0% {
            opacity: 0;
            transform: scale(0.65);
            filter:
                blur(14px)
                brightness(2)
                drop-shadow(0 0 30px rgba(255,255,255,0.9));
        }

        45% {
            opacity: 0.5;
            transform: scale(1.08);
            filter:
                blur(5px)
                brightness(1.8)
                drop-shadow(0 0 25px rgba(255,255,255,0.8));
        }

        75% {
            opacity: 0.9;
            transform: scale(0.98);
            filter:
                blur(1px)
                brightness(1.3)
                drop-shadow(0 0 18px rgba(255,255,255,0.6));
        }

        100% {
            opacity: 1;
            transform: scale(1);
            filter:
                blur(0)
                brightness(1)
                drop-shadow(0 0 12px rgba(255,255,255,0.25));
        }
    }

    @keyframes glowPulse {
        0%, 100% {
            transform: scale(0.8);
            opacity: 0.35;
        }

        50% {
            transform: scale(1.15);
            opacity: 0.7;
        }
    }

    @keyframes splashOut {
        0% {
            opacity: 1;
            transform: scale(1);
        }

        100% {
            opacity: 0;
            transform: scale(1.04);
            visibility: hidden;
        }
    }

    /* =========================
       PÁGINA DE INICIO
    ========================== */

    #home {
        min-height: 100vh;
        overflow-y: auto;
        opacity: 0;

        animation: homeAppear 0.8s ease forwards;
        animation-delay: 2.3s;
    }

    @keyframes homeAppear {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Encabezado */

    header {
        padding: 22px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .app-name {
        font-size: 22px;
        font-weight: bold;
    }

    .search {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    /* Contenido */

    main {
        padding: 5px 20px 100px;
    }

    .section-title {
        font-size: 25px;
        margin: 20px 0 15px;
    }

    /* Historia destacada */

    .featured {
        height: 230px;
        border-radius: 18px;
        background: linear-gradient(135deg, #222, #090909);
        border: 1px solid #292929;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        overflow: hidden;
    }

    .featured::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        right: -50px;
        top: -50px;
        border-radius: 50%;
        background: rgba(255,255,255,0.04);
        filter: blur(20px);
    }

    .featured small {
        color: #aaa;
        margin-bottom: 8px;
    }

    .featured h2 {
        font-size: 27px;
        margin-bottom: 8px;
    }

    .featured p {
        color: #aaa;
        font-size: 14px;
    }

    /* Tarjetas */

    .stories {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 10px;
    }

    .story {
        min-width: 145px;
        height: 190px;
        border-radius: 15px;
        background: #151515;
        border: 1px solid #292929;
        padding: 15px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .story .cover {
        flex: 1;
        border-radius: 10px;
        background: linear-gradient(145deg, #292929, #101010);
        margin-bottom: 12px;
    }

    .story h3 {
        font-size: 15px;
    }

    .story span {
        color: #888;
        font-size: 12px;
        margin-top: 4px;
    }

    /* Navegación */

    nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: rgba(0,0,0,0.94);
        border-top: 1px solid #222;

        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    nav div {
        color: #777;
        font-size: 12px;
        text-align: center;
    }

    nav .active {
        color: white;
    }

    nav .icon {
        font-size: 20px;
        margin-bottom: 3px;
    }
</style>
