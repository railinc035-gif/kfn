<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMEN - Plataforma de Lectura y Creación</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-panel: #111111;
            --bg-card: #161616;
            --border-color: #262626;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-primary: #ffffff;
            --accent-hover: #e5e5e5;
            --accent-light: rgba(255, 255, 255, 0.1);
            --danger-color: #ef4444;
            --nav-bg: rgba(0, 0, 0, 0.94);
            --modal-bg: #111111;
            --reader-bg: #000000;
            --reader-text: #ffffff;
        }

        body.theme-claro {
            --bg-main: #f8fafc;
            --bg-panel: #ffffff;
            --bg-card: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #0f172a;
            --accent-hover: #1e293b;
            --accent-light: rgba(15, 23, 42, 0.08);
            --nav-bg: rgba(248, 250, 252, 0.94);
            --modal-bg: #ffffff;
            --reader-bg: #ffffff;
            --reader-text: #0f172a;
        }

        body.reader-sepia {
            --reader-bg: #fbf0d9;
            --reader-text: #5f4b32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* =========================
           SPLASH / LOGO ANIMATION
        ========================== */
        #splash {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            animation: splashOut 0.7s ease forwards;
            animation-delay: 2.2s;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            filter: blur(45px);
            animation: glowPulse 1.4s ease-in-out infinite alternate;
        }

        .splash-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            position: relative;
            opacity: 0;
            transform: scale(0.75);
            filter: blur(10px) brightness(1.5) drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
            animation: logoAppear 1.1s cubic-bezier(.17, .67, .25, 1.2) forwards;
        }

        .splash-sub {
            color: #888888;
            font-size: 13px;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            opacity: 0;
            animation: logoAppear 1.1s cubic-bezier(.17, .67, .25, 1.2) forwards;
            animation-delay: 0.2s;
        }

        @keyframes logoAppear {
            0% { opacity: 0; transform: scale(0.65); filter: blur(14px) brightness(2) drop-shadow(0 0 30px rgba(255, 255, 255, 0.9)); }
            45% { opacity: 0.5; transform: scale(1.08); filter: blur(5px) brightness(1.8) drop-shadow(0 0 25px rgba(255, 255, 255, 0.8)); }
            75% { opacity: 0.9; transform: scale(0.98); filter: blur(1px) brightness(1.3) drop-shadow(0 0 18px rgba(255, 255, 255, 0.6)); }
            100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1) drop-shadow(0 0 12px rgba(255, 255, 255, 0.25)); }
        }

        @keyframes glowPulse {
            0% { transform: scale(0.8); opacity: 0.35; }
            100% { transform: scale(1.15); opacity: 0.7; }
        }

        @keyframes splashOut {
            0% { opacity: 1; transform: scale(1); }
            99% { opacity: 0; transform: scale(1.04); }
            100% { opacity: 0; transform: scale(1.04); visibility: hidden; display: none; }
        }

        /* =========================
           HEADER
        ========================== */
        header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .app-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-btn, .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover, .theme-btn:hover {
            border-color: var(--text-primary);
            background: var(--accent-light);
        }

        /* =========================
           MAIN CONTENT & TABS
        ========================== */
        main {
            flex: 1;
            padding: 15px 20px 90px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
            animation: tabAppear 0.3s ease forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes tabAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 22px 0 14px;
        }

        .section-title:first-child {
            margin-top: 5px;
        }

        /* Featured Story Card */
        .featured {
            height: 230px;
            border-radius: 18px;
            background: linear-gradient(135deg, #222222, #090909);
            border: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s;
        }

        .featured:hover {
            transform: translateY(-2px);
            border-color: #444;
        }

        .featured::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -50px;
            top: -50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(20px);
        }

        .featured small {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .featured h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .featured p {
            color: #aaaaaa;
            font-size: 13px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Stories Carousels & Grid */
        .stories {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }

        .stories::-webkit-scrollbar {
            display: none;
        }

        .story {
            min-width: 145px;
            width: 145px;
            height: 200px;
            border-radius: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .story:hover {
            transform: translateY(-3px);
            border-color: #444;
        }

        .story .cover {
            flex: 1;
            border-radius: 10px;
            background: linear-gradient(145deg, #292929, #101010);
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .story .cover .genre {
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 6px;
            align-self: flex-start;
        }

        .story h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .story span {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 2px;
            display: block;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }

        /* Explore Bar */
        .search-bar {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin-bottom: 14px;
        }

        .search-bar:focus {
            border-color: var(--accent-primary);
        }

        .category-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .category-pills::-webkit-scrollbar {
            display: none;
        }

        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .pill.active {
            background: var(--text-primary);
            color: var(--bg-main);
            border-color: var(--text-primary);
        }

        /* Profile & Publishing */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #333333, #111111);
            border: 2px solid var(--border-color);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
        }

        .profile-handle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            margin-top: 18px;
            padding-top: 14px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-num {
            font-size: 17px;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .btn-action {
            background: var(--text-primary);
            color: var(--bg-main);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .work-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .work-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .work-info h4 {
            font-size: 15px;
            font-weight: 700;
        }

        .work-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .work-btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-icon-sm {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-icon-sm.delete:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        /* Bottom Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        nav div {
            color: var(--text-secondary);
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            width: 25%;
            transition: color 0.2s;
        }

        nav .active {
            color: var(--text-primary);
            font-weight: bold;
        }

        nav .icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Modals & Reader Overlay */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        @media (min-width: 600px) {
            .modal { align-items: center; padding: 20px; }
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 550px;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            overflow-y: auto;
            padding: 24px;
        }

        @media (min-width: 600px) {
            .modal-box { border-radius: 20px; }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-head h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 90px;
        }

        /* Reader Mode View */
        #reader-view {
            position: fixed;
            inset: 0;
            background: var(--reader-bg);
            color: var(--reader-text);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        #reader-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .reader-bar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--reader-bg);
        }

        .reader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--text-primary);
            width: 0%;
            transition: width 0.1s;
        }

        .reader-head-info {
            text-align: center;
            flex: 1;
            padding: 0 10px;
        }

        .reader-head-title {
            font-size: 14px;
            font-weight: 700;
        }

        .reader-head-author {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .reader-actions {
            display: flex;
            gap: 6px;
        }

        .reader-opt-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--reader-text);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .reader-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 60px;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
            line-height: 1.8;
            font-size: 17px;
        }

        .reader-content p {
            margin-bottom: 1.4em;
            text-indent: 1em;
        }

        .empty-text {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 10px;
            font-size: 14px;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #222222;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="theme-oscuro">

    <!-- Splash Screen -->
    <div id="splash">
        <div class="glow"></div>
        <div class="splash-title">FRAMEN</div>
        <div class="splash-sub">Lectura & Creación de Historias</div>
    </div>

    <!-- Header -->
    <header>
        <div class="app-name" onclick="switchTab('home')">FRAMEN</div>
        <div class="header-actions">
            <button class="search-btn" title="Buscar" onclick="switchTab('explore')">⌕</button>
            <button class="theme-btn" title="Cambiar tema" onclick="toggleTheme()">☯</button>
        </div>
    </header>

    <!-- Content Tabs -->
    <main>
        <!-- Home Tab -->
        <section id="tab-home" class="tab-content active">
            <div id="featured-container"></div>

            <h2 class="section-title">Historias nuevas</h2>
            <div class="stories" id="new-stories"></div>

            <h2 class="section-title">Más leídas</h2>
            <div class="stories" id="popular-stories"></div>
        </section>

        <!-- Explore Tab -->
        <section id="tab-explore" class="tab-content">
            <input type="text" id="search-input" class="search-bar" placeholder="Buscar por título, autor o género..." oninput="onSearchInput()">

            <div class="category-pills" id="category-pills">
                <button class="pill active" onclick="setCategory('Todo', this)">Todo</button>
                <button class="pill" onclick="setCategory('Fantasía', this)">Fantasía</button>
                <button class="pill" onclick="setCategory('Ciencia Ficción', this)">Ciencia Ficción</button>
                <button class="pill" onclick="setCategory('Romance', this)">Romance</button>
                <button class="pill" onclick="setCategory('Misterio', this)">Misterio</button>
                <button class="pill" onclick="setCategory('Poesía', this)">Poesía</button>
                <button class="pill" onclick="setCategory('Drama', this)">Drama</button>
            </div>

            <div class="stories-grid" id="explore-grid"></div>
        </section>

        <!-- Library Tab -->
        <section id="tab-library" class="tab-content">
            <h2 class="section-title">Mi Biblioteca</h2>
            <div class="stories-grid" id="library-grid"></div>
        </section>

        <!-- Profile Tab -->
        <section id="tab-profile" class="tab-content">
            <div class="profile-card">
                <div class="profile-avatar">F</div>
                <h2 class="profile-name">Autor FRAMEN</h2>
                <div class="profile-handle">@autor_framen</div>
                <button class="btn-action" onclick="openPublishModal()">+ Subir nueva obra</button>

                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-num" id="stat-works">0</div>
                        <div class="stat-lbl">Obras</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="stat-likes">0</div>
                        <div class="stat-lbl">Me gusta</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="stat-reads">0</div>
                        <div class="stat-lbl">Lecturas</div>
                    </div>
                </div>
            </div>

            <h2 class="section-title">Mis Obras Publicadas</h2>
            <div class="work-list" id="my-works-list"></div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav>
        <div class="active" onclick="switchTab('home')">
            <div class="icon">⌂</div>
            Inicio
        </div>
        <div onclick="switchTab('explore')">
            <div class="icon">◉</div>
            Explorar
        </div>
        <div onclick="switchTab('library')">
            <div class="icon">▢</div>
            Biblioteca
        </div>
        <div onclick="switchTab('profile')">
            <div class="icon">○</div>
            Perfil
        </div>
    </nav>

    <!-- Story Details Modal -->
    <div id="story-modal" class="modal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="detail-title">Detalles</h3>
                <button class="btn-icon-sm" onclick="closeModal('story-modal')">✕</button>
            </div>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Publish/Edit Modal -->
    <div id="publish-modal" class="modal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="publish-title">Subir nueva obra</h3>
                <button class="btn-icon-sm" onclick="closeModal('publish-modal')">✕</button>
            </div>
            <form id="publish-form" onsubmit="onPublishSubmit(event)">
                <input type="hidden" id="edit-id" value="">

                <div class="form-group">
                    <label class="form-label" for="story-title-in">Título de la obra</label>
                    <input type="text" id="story-title-in" class="form-input" placeholder="Ej: Las Sombras de FRAMEN" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="story-category-in">Género</label>
                    <select id="story-category-in" class="form-input" required>
                        <option value="Fantasía">Fantasía</option>
                        <option value="Ciencia Ficción">Ciencia Ficción</option>
                        <option value="Romance">Romance</option>
                        <option value="Misterio">Misterio</option>
                        <option value="Poesía">Poesía</option>
                        <option value="Drama">Drama</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="story-synopsis-in">Sinopsis</label>
                    <textarea id="story-synopsis-in" class="form-input" placeholder="Resumen de tu historia..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="story-content-in">Contenido de la obra</label>
                    <textarea id="story-content-in" class="form-input" style="min-height: 140px;" placeholder="Escribe tu historia o capítulo aquí..." required></textarea>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px;">
                    <button type="button" class="pill" onclick="closeModal('publish-modal')">Cancelar</button>
                    <button type="submit" class="btn-action" style="margin-top:0;" id="publish-submit-btn">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Full Reader View Overlay -->
    <div id="reader-view">
        <div class="reader-progress" id="reader-progress"></div>
        <div class="reader-bar">
            <button class="btn-icon-sm" onclick="closeReader()">←</button>
            <div class="reader-head-info">
                <div class="reader-head-title" id="reader-head-title">Título</div>
                <div class="reader-head-author" id="reader-head-author">por Autor</div>
            </div>
            <div class="reader-actions">
                <button class="reader-opt-btn" onclick="changeFontSize(-1)">A-</button>
                <button class="reader-opt-btn" onclick="changeFontSize(1)">A+</button>
                <button class="reader-opt-btn" onclick="toggleReaderTheme()">Fondo</button>
            </div>
        </div>
        <div class="reader-content" id="reader-content" onscroll="onReaderScroll()"></div>
    </div>

    <!-- Toast -->
    <div id="toast">Notificación</div>

    <script>
        const INITIAL_STORIES = [
            {
                id: "framen-1",
                title: "El Origen de FRAMEN",
                author: "M. K. Vance",
                category: "Ciencia Ficción",
                coverGradient: "linear-gradient(135deg, #1f2937, #111827)",
                synopsis: "En una metrópolis dominada por datos, un programador descubre la primera conciencia sintética que busca libertad.",
                content: "Capítulo 1: Código Cero\n\nLas luces parpadeantes de la terminal proyectaban sombras alargadas en el refugio subterráneo. Marcus ajustó la interfaz neuronal y observó cómo las líneas de código comenzaban a responder de manera autónoma.\n\nNo era un algoritmo convencional. FRAMEN no solo procesaba datos; estaba despertando.",
                likes: 420,
                reads: 3100,
                isUser: false
            },
            {
                id: "framen-2",
                title: "Leyendas del Bosque Sombrío",
                author: "Elena Rostova",
                category: "Fantasía",
                coverGradient: "linear-gradient(135deg, #065f46, #022c22)",
                synopsis: "Un antiguo amuleto despierta a los espíritus guardianes del bosque antes de la caída del eclipse lunar.",
                content: "Capítulo 1: El Eclipse\n\nLas hojas secas crujían bajo las botas de Elena mientras se adentraba en el bosque. El aire olía a pino y a lluvia inminente.\n\nAl alzar el amuleto hacia la luna creciente, una luz plateada iluminó las copas de los árboles añejos.",
                likes: 310,
                reads: 2400,
                isUser: false
            },
            {
                id: "framen-3",
                title: "Cartas a la Luz de la Luna",
                author: "Sofía Meller",
                category: "Romance",
                coverGradient: "linear-gradient(135deg, #831843, #500724)",
                synopsis: "Dos poetas se comunican mediante notas dejadas en la antigua biblioteca central de la ciudad.",
                content: "Capítulo 1: La primera nota\n\nEntre las páginas del tomo amarillento de poesía clásica, hallé una nota manuscrita con tinta lavanda.\n\n'Quienquiera que leas esto a medianoche, comparte conmigo tu pensamiento más profundo.'",
                likes: 290,
                reads: 1850,
                isUser: false
            }
        ];

        let appState = {
            stories: [],
            library: [],
            activeCategory: 'Todo',
            searchQuery: '',
            readerFontSize: 17,
            readerTheme: 0
        };

        function initApp() {
            const storedStories = localStorage.getItem('framen_stories');
            if (storedStories) {
                try {
                    appState.stories = JSON.parse(storedStories);
                } catch (e) {
                    appState.stories = [...INITIAL_STORIES];
                }
            } else {
                appState.stories = [...INITIAL_STORIES];
                saveStories();
            }

            const storedLib = localStorage.getItem('framen_library');
            if (storedLib) {
                try {
                    appState.library = JSON.parse(storedLib);
                } catch (e) {
                    appState.library = [];
                }
            }

            renderAllSections();
        }

        function saveStories() {
            localStorage.setItem('framen_stories', JSON.stringify(appState.stories));
        }

        function saveLibrary() {
            localStorage.setItem('framen_library', JSON.stringify(appState.library));
        }

        function renderAllSections() {
            renderHome();
            renderExplore();
            renderLibrary();
            renderProfile();
        }

        function renderHome() {
            const featContainer = document.getElementById('featured-container');
            const newContainer = document.getElementById('new-stories');
            const popContainer = document.getElementById('popular-stories');

            if (appState.stories.length === 0) return;

            const feat = appState.stories[0];
            featContainer.innerHTML = `
                <div class="featured" style="background: ${feat.coverGradient || 'linear-gradient(135deg, #222, #090909)'}" onclick="openStoryModal('${feat.id}')">
                    <small>Historia destacada</small>
                    <h2>${escapeHtml(feat.title)}</h2>
                    <p>${escapeHtml(feat.synopsis)}</p>
                </div>
            `;

            const newest = [...appState.stories].reverse();
            newContainer.innerHTML = newest.map(s => createStoryCard(s)).join('');

            const popular = [...appState.stories].sort((a,b) => (b.likes||0) - (a.likes||0));
            popContainer.innerHTML = popular.map(s => createStoryCard(s)).join('');
        }

        function renderExplore() {
            const grid = document.getElementById('explore-grid');
            let list = appState.stories;

            if (appState.activeCategory !== 'Todo') {
                list = list.filter(s => s.category === appState.activeCategory);
            }

            if (appState.searchQuery.trim() !== '') {
                const q = appState.searchQuery.toLowerCase();
                list = list.filter(s =>
                    s.title.toLowerCase().includes(q) ||
                    s.author.toLowerCase().includes(q) ||
                    s.category.toLowerCase().includes(q)
                );
            }

            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-text" style="grid-column: 1/-1;">No se encontraron historias.</div>';
            } else {
                grid.innerHTML = list.map(s => createStoryCard(s, true)).join('');
            }
        }

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            const saved = appState.stories.filter(s => appState.library.includes(s.id));

            if (saved.length === 0) {
                grid.innerHTML = '<div class="empty-text" style="grid-column: 1/-1;">Tu biblioteca está vacía.<br>Guarda tus historias favoritas para leerlas luego.</div>';
            } else {
                grid.innerHTML = saved.map(s => createStoryCard(s, true)).join('');
            }
        }

        function renderProfile() {
            const myWorks = appState.stories.filter(s => s.isUser);
            const listContainer = document.getElementById('my-works-list');

            document.getElementById('stat-works').textContent = myWorks.length;
            const totalLikes = myWorks.reduce((sum, w) => sum + (w.likes || 0), 0);
            document.getElementById('stat-likes').textContent = totalLikes;
            const totalReads = myWorks.reduce((sum, w) => sum + (w.reads || 0), 0);
            document.getElementById('stat-reads').textContent = totalReads;

            if (myWorks.length === 0) {
                listContainer.innerHTML = '<div class="empty-text">Aún no has publicado ninguna obra.<br>¡Haz clic en "+ Subir nueva obra" para comenzar!</div>';
            } else {
                listContainer.innerHTML = myWorks.map(w => `
                    <div class="work-item">
                        <div class="work-info">
                            <h4>${escapeHtml(w.title)}</h4>
                            <p>${escapeHtml(w.category)} • ${w.likes||0} me gusta • ${w.reads||0} lecturas</p>
                        </div>
                        <div class="work-btn-group">
                            <button class="btn-icon-sm" title="Editar" onclick="openEditModal('${w.id}')">✎</button>
                            <button class="btn-icon-sm delete" title="Eliminar" onclick="deleteWork('${w.id}')">✕</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function createStoryCard(story, isGrid = false) {
            const isSaved = appState.library.includes(story.id);
            return `
                <div class="story" style="${isGrid ? 'width:100%; min-width:0;' : ''}" onclick="openStoryModal('${story.id}')">
                    <div class="cover" style="background: ${story.coverGradient || 'linear-gradient(145deg, #292929, #101010)'}">
                        <span class="genre">${escapeHtml(story.category)}</span>
                    </div>
                    <h3>${escapeHtml(story.title)}</h3>
                    <span>by ${escapeHtml(story.author)} ${isSaved ? '★' : ''}</span>
                </div>
            `;
        }

        /* Navigation & Tabs */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav div').forEach(d => d.classList.remove('active'));

            const targetTab = document.getElementById('tab-' + tabId);
            if (targetTab) targetTab.classList.add('active');

            const tabIndexMap = { 'home': 0, 'explore': 1, 'library': 2, 'profile': 3 };
            const navItems = document.querySelectorAll('nav div');
            if (navItems[tabIndexMap[tabId]]) {
                navItems[tabIndexMap[tabId]].classList.add('active');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('theme-claro');
            document.body.classList.toggle('theme-oscuro');
        }

        /* Story Detail Modal */
        function openStoryModal(storyId) {
            const story = appState.stories.find(s => s.id === storyId);
            if (!story) return;

            const isSaved = appState.library.includes(story.id);
            document.getElementById('detail-title').textContent = story.title;

            document.getElementById('detail-content').innerHTML = `
                <div style="padding: 14px; border-radius: 12px; background: ${story.coverGradient || '#222'}; color: white; margin-bottom: 14px;">
                    <span style="font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px;">${escapeHtml(story.category)}</span>
                    <h2 style="font-size: 20px; margin-top: 8px;">${escapeHtml(story.title)}</h2>
                    <p style="font-size: 12px; opacity: 0.8;">por ${escapeHtml(story.author)}</p>
                </div>
                <div style="margin-bottom: 18px;">
                    <h4 style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">SINOPSIS</h4>
                    <p style="font-size: 14px; line-height: 1.5;">${escapeHtml(story.synopsis)}</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" style="flex:1; justify-content: center;" onclick="closeModal('story-modal'); openReader('${story.id}')">Leer Ahora</button>
                    <button class="pill" onclick="toggleBookmark('${story.id}')" id="modal-fav-btn">${isSaved ? '★ Guardado' : '☆ Guardar'}</button>
                </div>
            `;

            document.getElementById('story-modal').classList.add('active');
        }

        function toggleBookmark(storyId) {
            const idx = appState.library.indexOf(storyId);
            if (idx > -1) {
                appState.library.splice(idx, 1);
                showToast('Eliminado de tu biblioteca');
            } else {
                appState.library.push(storyId);
                showToast('Guardado en tu biblioteca');
            }
            saveLibrary();
            renderAllSections();

            const btn = document.getElementById('modal-fav-btn');
            if (btn) {
                btn.textContent = appState.library.includes(storyId) ? '★ Guardado' : '☆ Guardar';
            }
        }

        /* Reader Mode */
        function openReader(storyId) {
            const story = appState.stories.find(s => s.id === storyId);
            if (!story) return;

            story.reads = (story.reads || 0) + 1;
            saveStories();

            document.getElementById('reader-head-title').textContent = story.title;
            document.getElementById('reader-head-author').textContent = 'por ' + story.author;

            const paragraphs = story.content.split('\n\n');
            document.getElementById('reader-content').innerHTML = `
                <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">${escapeHtml(story.title)}</h1>
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                    Género: ${escapeHtml(story.category)} • Autor: ${escapeHtml(story.author)}
                </div>
                ${paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
            `;

            document.getElementById('reader-content').style.fontSize = appState.readerFontSize + 'px';
            document.getElementById('reader-view').classList.add('active');
            onReaderScroll();
        }

        function closeReader() {
            document.getElementById('reader-view').classList.remove('active');
        }

        function changeFontSize(delta) {
            appState.readerFontSize = Math.max(13, Math.min(26, appState.readerFontSize + delta));
            document.getElementById('reader-content').style.fontSize = appState.readerFontSize + 'px';
        }

        function toggleReaderTheme() {
            const body = document.body;
            body.classList.remove('reader-sepia');
            appState.readerTheme = (appState.readerTheme + 1) % 3;

            if (appState.readerTheme === 1) {
                body.classList.add('reader-sepia');
            } else if (appState.readerTheme === 2) {
                if (!body.classList.contains('theme-claro')) toggleTheme();
            } else {
                if (body.classList.contains('theme-claro')) toggleTheme();
            }
        }

        function onReaderScroll() {
            const el = document.getElementById('reader-content');
            const total = el.scrollHeight - el.clientHeight;
            const pct = total > 0 ? (el.scrollTop / total) * 100 : 0;
            document.getElementById('reader-progress').style.width = pct + '%';
        }

        /* Publishing System */
        function openPublishModal() {
            document.getElementById('publish-title').textContent = 'Subir nueva obra';
            document.getElementById('publish-submit-btn').textContent = 'Publicar';
            document.getElementById('edit-id').value = '';
            document.getElementById('publish-form').reset();
            document.getElementById('publish-modal').classList.add('active');
        }

        function openEditModal(storyId) {
            const story = appState.stories.find(s => s.id === storyId);
            if (!story) return;

            document.getElementById('publish-title').textContent = 'Editar obra';
            document.getElementById('publish-submit-btn').textContent = 'Guardar';
            document.getElementById('edit-id').value = story.id;
            document.getElementById('story-title-in').value = story.title;
            document.getElementById('story-category-in').value = story.category;
            document.getElementById('story-synopsis-in').value = story.synopsis;
            document.getElementById('story-content-in').value = story.content;

            document.getElementById('publish-modal').classList.add('active');
        }

        function onPublishSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const title = document.getElementById('story-title-in').value.trim();
            const category = document.getElementById('story-category-in').value;
            const synopsis = document.getElementById('story-synopsis-in').value.trim();
            const content = document.getElementById('story-content-in').value.trim();

            if (editId) {
                const story = appState.stories.find(s => s.id === editId);
                if (story) {
                    story.title = title;
                    story.category = category;
                    story.synopsis = synopsis;
                    story.content = content;
                    showToast('Obra actualizada');
                }
            } else {
                const gradients = [
                    'linear-gradient(135deg, #2563eb, #1d4ed8)',
                    'linear-gradient(135deg, #7c3aed, #6d28d9)',
                    'linear-gradient(135deg, #db2777, #be185d)',
                    'linear-gradient(135deg, #059669, #047857)'
                ];
                const newWork = {
                    id: 'framen-user-' + Date.now(),
                    title: title,
                    author: 'Autor FRAMEN (Tú)',
                    category: category,
                    coverGradient: gradients[Math.floor(Math.random() * gradients.length)],
                    synopsis: synopsis,
                    content: content,
                    likes: 1,
                    reads: 0,
                    isUser: true
                };
                appState.stories.unshift(newWork);
                showToast('¡Tu obra fue publicada en FRAMEN!');
            }

            saveStories();
            closeModal('publish-modal');
            renderAllSections();
        }

        function deleteWork(storyId) {
            if (confirm('¿Deseas eliminar esta obra de FRAMEN?')) {
                appState.stories = appState.stories.filter(s => s.id !== storyId);
                appState.library = appState.library.filter(id => id !== storyId);
                saveStories();
                saveLibrary();
                renderAllSections();
                showToast('Obra eliminada');
            }
        }

        /* Search & Filters */
        function onSearchInput() {
            appState.searchQuery = document.getElementById('search-input').value;
            renderExplore();
        }

        function setCategory(cat, btn) {
            appState.activeCategory = cat;
            document.querySelectorAll('#category-pills .pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderExplore();
        }

        /* Helpers */
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
